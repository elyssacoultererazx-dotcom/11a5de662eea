      - run:
          name: Load reads
          command: |
            printf 'read UMI AACC\n' > umi.txt
      - run:
          name: Build dedup tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target umi_dedup -j2
      - run:
          name: Collapse UMI duplicates
          command: LIONSS_LP=1 ./build/umi_dedup --in umi.txt --edit 1
